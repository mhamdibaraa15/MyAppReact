services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./Server
    image: mern-server
    container_name: mern-server
    ports:
      - "9000:9000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/mernapp
    depends_on:
      - mongo

  client:
    build: ./Client
    image: mern-client
    container_name: mern-client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo-data:
